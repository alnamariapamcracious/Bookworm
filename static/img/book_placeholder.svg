<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450">
  <defs>
    <!-- Vibrant Multi-stop Background Gradient -->
    <linearGradient id="vibrantCoverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="35%" stop-color="#1e1b4b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Coral to Lavender Glow -->
    <linearGradient id="neonGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Warm Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Subtle mesh radial glow -->
    <radialGradient id="meshGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.25)"/>
      <stop offset="60%" stop-color="rgba(244, 63, 94, 0.12)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Cover Base -->
  <rect width="300" height="450" rx="10" fill="url(#vibrantCoverGrad)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="2"/>
  
  <!-- Radial Glow Behind Icon -->
  <circle cx="150" cy="190" r="110" fill="url(#meshGlow)"/>

  <!-- Left Book Spine Emboss Effect -->
  <rect x="0" y="0" width="24" height="450" rx="6" fill="rgba(255, 255, 255, 0.06)"/>
  <line x1="24" y1="0" x2="24" y2="450" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  <line x1="18" y1="0" x2="18" y2="450" stroke="rgba(0, 0, 0, 0.3)" stroke-width="1"/>

  <!-- Decorative Border Frame -->
  <rect x="38" y="24" width="236" height="402" rx="6" fill="none" stroke="url(#neonGlowGrad)" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.6"/>

  <!-- Stylized Open Book Vector Icon -->
  <g transform="translate(150, 180) scale(1.65)">
    <!-- Pages Left & Right -->
    <path d="M-20 -15 C -9 -18, -3 -14, 0 -10 C 3 -14, 9 -18, 20 -15 L 20 18 C 9 15, 3 19, 0 22 C -3 19, -9 15, -20 18 Z" 
          fill="rgba(30, 27, 75, 0.6)" stroke="url(#neonGlowGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Spine Center Line -->
    <line x1="0" y1="-10" x2="0" y2="22" stroke="url(#goldGrad)" stroke-width="2"/>
    
    <!-- Left Lines -->
    <line x1="-15" y1="-6" x2="-5" y2="-5" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
    <line x1="-15" y1="2" x2="-5" y2="3" stroke="#a855f7" stroke-width="1.5" opacity="0.8"/>
    <line x1="-15" y1="10" x2="-5" y2="11" stroke="#f43f5e" stroke-width="1.5" opacity="0.8"/>
    
    <!-- Right Lines -->
    <line x1="5" y1="-5" x2="15" y2="-6" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
    <line x1="5" y1="3" x2="15" y2="2" stroke="#a855f7" stroke-width="1.5" opacity="0.8"/>
    <line x1="5" y1="11" x2="15" y2="10" stroke="#f43f5e" stroke-width="1.5" opacity="0.8"/>

    <!-- Sparkles -->
    <circle cx="22" cy="-18" r="2" fill="#fbbf24"/>
    <circle cx="-22" cy="-16" r="1.5" fill="#34d399"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="150" y="260" text-anchor="middle" font-family="'Georgia', serif" font-size="16" font-weight="bold" fill="#f8fafc" letter-spacing="0.5">Classic Edition</text>
  <text x="150" y="282" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a78bfa">Reader's Catalog</text>
  
  <!-- Glowing Divider Line -->
  <line x1="70" y1="305" x2="230" y2="305" stroke="url(#neonGlowGrad)" stroke-width="1.5" opacity="0.7"/>

  <!-- Tag Pill -->
  <rect x="85" y="325" width="130" height="26" rx="13" fill="rgba(244, 63, 94, 0.15)" stroke="rgba(244, 63, 94, 0.4)" stroke-width="1"/>
  <text x="150" y="342" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fb7185" letter-spacing="1.5">APRIORI MINED</text>
</svg>
